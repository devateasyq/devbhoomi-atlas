<!doctype html><meta charset="utf-8"><title>probe</title>
<div id="out">running</div>
<iframe id="app" src="../index.html" style="width:900px;height:700px"></iframe>
<script>
window.addEventListener("load", async () => {
  const o = document.getElementById("out");
  const w = document.getElementById("app").contentWindow;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  await wait(800);
  const ev = s => { try { return String(w.eval(s)); } catch(e){ return "THREW: " + e.message; } };
  const L = [];
  L.push("typeof viewMarch=" + ev("typeof viewMarch"));
  L.push("CHIPS.length=" + ev("CHIPS.length"));
  L.push("S.marchAt=" + ev("S.marchAt"));
  L.push("MAPwh=" + ev("MAP.w+'/'+MAP.h"));
  L.push("ERA0=" + ev("JSON.stringify(ERA[CHIPS[0].era])"));
  L.push("viewMarchLen=" + ev("viewMarch().length"));
  L.push("viewMarchHead=" + ev("viewMarch().slice(0,100)"));
  o.textContent = L.join(" ||| ");
});
</script>
