<!doctype html>
<meta charset="utf-8">
<title>Parikrama Path — interaction harness</title>
<style>
 body{font:13px/1.5 system-ui;margin:0;padding:16px;background:#111614;color:#E9ECE5}
 #out{font-family:ui-monospace,monospace;white-space:pre-wrap}
 .pass{color:#69B487} .fail{color:#E08872;font-weight:700}
 iframe{width:1000px;height:760px;border:1px solid #333;background:#fff}
</style>
<h1>Interaction harness</h1>
<div id="out">running…</div>
<iframe id="app" src="../index.html"></iframe>
<script>
const out = document.getElementById("out");
let pass = 0, fail = 0;
function check(name, cond, detail){
  const ok = !!cond;
  ok ? pass++ : fail++;
  out.innerHTML += '<div class="' + (ok ? "pass" : "fail") + '">' +
    (ok ? "PASS  " : "FAIL  ") + name + (ok || !detail ? "" : "  — " + detail) + "</div>";
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Synthetic pointer sequences. These drive the app's pointerdown/pointermove/
   pointerup handlers directly — clickEl() never dispatches a `click` event,
   and the app never listens for one, so this does not exercise (and cannot
   guard) click retargeting from pointer capture. What it does verify: a
   plain pointerdown+pointerup opens a record, and a pointerdown followed by
   a pointermove past the drag threshold does not. */
function pointerAt(el, type, x, y){
  el.dispatchEvent(new PointerEvent(type, {
    clientX:x, clientY:y, pointerId:1, button:0, bubbles:true, cancelable:true
  }));
}
function clickEl(win, el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  pointerAt(el, "pointerdown", x, y);
  pointerAt(el, "pointerup", x, y);
}
function dragEl(win, el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  pointerAt(el, "pointerdown", x, y);
  pointerAt(el, "pointermove", x + 40, y + 40);
  pointerAt(el, "pointerup", x + 40, y + 40);
}

window.addEventListener("load", async () => {
  out.innerHTML = "";
  const f = document.getElementById("app");
  const win = f.contentWindow, doc = f.contentDocument;
  await wait(700);

  /* app.js declares `const S`, which is script-scoped and therefore NOT a
     property of window — `win.S` is undefined and every assertion against
     it would silently pass. Indirect eval runs in the frame's global scope,
     where top-level const IS visible. Function declarations (render,
     openRec, runSearch) do land on window, so those are called directly. */
  const ev = src => win.eval(src);

  ev('S.view="map"; render();');
  await wait(300);

  for(const kind of ["peak","pass","lake","glacier","temple","battle","state"]){
    check(kind + " markers render with no mode selected",
      doc.querySelectorAll('.mk[data-k="' + kind + '"]').length > 0);
  }

  for(const kind of ["peak","pass","lake","glacier"]){
    const mk = doc.querySelector('.mk[data-k="' + kind + '"]');
    check(kind + " marker exists", mk);
    if(!mk) continue;
    const expect = mk.dataset.rec;
    check(kind + " marker is wired to its own record",
      expect && /^(pk|ps|lk|gl)-/.test(expect), "data-rec=" + expect);
    doc.getElementById("panel").hidden = true;
    clickEl(win, mk);
    await wait(120);
    check(kind + " click opens the panel", !doc.getElementById("panel").hidden);
    check(kind + " click opens the right record", ev("S.sel") === expect,
      "got " + ev("S.sel") + ", wanted " + expect);
  }

  const mk = doc.querySelector(".mk");
  doc.getElementById("panel").hidden = true;
  ev("S.sel = null");
  dragEl(win, mk);
  await wait(120);
  check("a drag across a marker does NOT open the panel",
    doc.getElementById("panel").hidden);

  const boxes = [...doc.querySelectorAll(".mk:not(.nolabel):not(.hid) text")]
    .map(t => t.getBoundingClientRect());
  let overlaps = 0;
  for(let i = 0; i < boxes.length; i++)
    for(let j = i+1; j < boxes.length; j++){
      const a = boxes[i], b = boxes[j];
      if(!(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom)) overlaps++;
    }
  check("no two visible labels overlap at zoom 1", overlaps === 0, overlaps + " overlapping pairs");
  check("some labels are drawn", boxes.length > 3, boxes.length + " labels");

  const legendBtn = k => doc.querySelector('.lgi[data-lk="' + k + '"]');
  const visible = k => doc.querySelectorAll('.mk[data-k="' + k + '"]:not(.hid)').length;

  ev("S.mapOff = []; render();"); await wait(200);
  const basePeaks = visible("peak"), baseLakes = visible("lake");
  check("all peaks visible by default", basePeaks > 0);

  legendBtn("peak").dispatchEvent(new MouseEvent("click", {bubbles:true}));
  await wait(400);
  check("single click hides that layer", visible("peak") === 0);
  check("single click leaves other layers alone", visible("lake") === baseLakes);

  legendBtn("peak").dispatchEvent(new MouseEvent("click", {bubbles:true}));
  await wait(400);
  check("clicking again restores the layer", visible("peak") === basePeaks);

  /* A real double click always fires click, click, dblclick in that order.
     Dispatching a bare dblclick skips the two clicks whose deferred toggle
     the dblclick handler's clearTimer() must cancel — so a regression that
     dropped clearTimer() from the dblclick handler would still pass this
     test if it were left out. The wait must exceed the 250ms single-click
     deferral, or a leaked toggle firing just after 250ms would land after
     the assertion instead of before it. */
  const passBtn1 = legendBtn("pass");
  passBtn1.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  passBtn1.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  passBtn1.dispatchEvent(new MouseEvent("dblclick", {bubbles:true}));
  await wait(400);
  check("double click isolates that layer",
    visible("pass") > 0 && visible("peak") === 0 && visible("lake") === 0);

  const passBtn2 = legendBtn("pass");
  passBtn2.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  passBtn2.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  passBtn2.dispatchEvent(new MouseEvent("dblclick", {bubbles:true}));
  await wait(400);
  check("double click again restores everything",
    visible("peak") === basePeaks && visible("lake") === baseLakes);

  check("Show all button is absent when nothing is hidden", !doc.getElementById("lgall"));

  win.openRec("ps-shipkila"); await wait(150);
  const pb = doc.getElementById("pbody").textContent;
  check("pass panel shows the height", /3,930 m/.test(pb));
  check("pass panel shows what it connects", /Tibet/.test(pb));
  check("pass panel shows a locator map", !!doc.querySelector("#pbody .locator"));
  check("pass panel shows district chips", /Kinnaur/.test(pb));
  check("pass panel kind label reads Pass",
    doc.getElementById("pkind").textContent.includes("Pass"));

  win.openRec("lk-pong"); await wait(150);
  check("lake panel shows the Ramsar year", /2002/.test(doc.getElementById("pbody").textContent));

  win.openRec("gl-barashigri"); await wait(150);
  check("glacier panel names the river it feeds",
    /Chenab|Chandra/.test(doc.getElementById("pbody").textContent));

  win.openRec("t-passes"); await wait(150);
  check("t-passes lists all 18 passes",
    doc.querySelectorAll('#pbody .relchip[data-go^="ps-"]').length === 18);

  win.openRec("t-peaks"); await wait(150);
  check("t-peaks lists peaks and glaciers",
    doc.querySelectorAll('#pbody .relchip[data-go^="pk-"]').length === 12 &&
    doc.querySelectorAll('#pbody .relchip[data-go^="gl-"]').length === 12);

  win.openRec("d-kinnaur"); await wait(150);
  check("a district lists its own features",
    doc.querySelectorAll('#pbody .relchip[data-go^="pk-"], #pbody .relchip[data-go^="ps-"]').length > 0);

  const hits = q => { win.runSearch(q);
    return [...doc.querySelectorAll("#results .res")].map(b => b.dataset.go); };
  check("searching a height finds the pass", hits("5,578").includes("ps-parangla") ||
                                             hits("5578").includes("ps-parangla"));
  check("searching a name finds the peak", hits("reo purgyil").includes("pk-reopurgyil"));
  check("searching 'shipki' finds the pass", hits("shipki").includes("ps-shipkila"));
  check("searching 'ramsar' finds the three sites",
    ["lk-pong","lk-renuka","lk-chandratal"].every(id => hits("ramsar").includes(id)));

  ev('S.view="rounds"; render();');
  await wait(400);
  const feed = doc.getElementById("roundsfeed");
  check("the feed renders", !!feed);
  if(feed){
    const cards = feed.querySelectorAll(".short");
    check("a window of cards is rendered, not one per fact",
      cards.length >= 20 && cards.length <= 40, cards.length + " cards");
    check("the feed is a scroll-snap container",
      win.getComputedStyle(feed).scrollSnapType.indexOf("mandatory") >= 0,
      win.getComputedStyle(feed).scrollSnapType);
    check("each card fills the feed",
      cards.length > 0 && Math.abs(cards[0].getBoundingClientRect().height -
        feed.getBoundingClientRect().height) < 2);

    const first = cards[0];
    const want = first.dataset.src;
    doc.getElementById("panel").hidden = true;
    first.querySelector(".shopen").click();
    await wait(150);
    check("tapping a card opens the record it names", ev("S.sel") === want,
      "got " + ev("S.sel") + ", wanted " + want);
    check("the card names a real record", !!want && want.length > 1);
    check("a card is not a button", !!doc.querySelector("article.short"),
      doc.querySelector(".short") ? doc.querySelector(".short").tagName : "none");
    check("no button is nested inside another button",
      !doc.querySelector("#roundsfeed button button"));
    check("the card still opens its record",
      !!doc.querySelector(".short .shopen[data-src]"));

    check("a card offers both confidence buttons",
      doc.querySelectorAll(".short .cfb").length >= 2);
    (function(){
      const card = doc.querySelector(".short");
      const got = card.querySelector('.cfb[data-conf="got"]');
      got.click();
      const stored = JSON.parse(win.localStorage.getItem("hpatlas:conf") || "{}");
      check("pressing Got it records it", (stored[card.dataset.fid]||{}).v === "got",
        JSON.stringify(stored[card.dataset.fid]));
      check("the button reads as pressed", got.getAttribute("aria-pressed") === "true");
      got.click();
      const after = JSON.parse(win.localStorage.getItem("hpatlas:conf") || "{}");
      check("pressing it again clears it",
        !Object.prototype.hasOwnProperty.call(after, card.dataset.fid), JSON.stringify(after));
    })();
    (function(){
      const feed = doc.getElementById("roundsfeed");
      const before = feed.children.length;
      const card = feed.children[0];
      card.querySelector('.cfb[data-conf="again"]').click();
      check("Again re-queues the card into the feed",
        feed.children.length === before + 1, before + " -> " + feed.children.length);
    })();
    await (async function(){
      const before = win.localStorage.getItem("hpatlas:posts");
      ev('savePost("A card written by the harness", ["d-kangra"])');
      const posts = JSON.parse(win.localStorage.getItem("hpatlas:posts") || "[]");
      check("a card can be written", posts.length >= 1 && /harness/.test(posts[0].text),
        JSON.stringify(posts[0] || null));
      check("a written card is private", posts[0] && posts[0].visibility === "private");
      check("a written card keeps its tag",
        posts[0] && posts[0].tags.indexOf("d-kangra") >= 0, JSON.stringify(posts[0] && posts[0].tags));
      win.openRec("d-kangra"); await wait(250);
      check("a tagged card shows on its record",
        /written by the harness/.test(doc.getElementById("pbody").textContent));
      ev('deletePost(' + JSON.stringify(posts[0].id) + ')');
      const after = JSON.parse(win.localStorage.getItem("hpatlas:posts") || "[]");
      check("a card can be removed", !after.some(p => /harness/.test(p.text)),
        JSON.stringify(after.map(p => p.id)));
    })();
  }

  ev('S.view="home"; render();');
  await wait(250);
  /* mobOnly entries (profile) are deliberately absent from the hub — they
     have the phone bar and the header's account button instead. */
  const hubIds = ev('NAV.filter(n => !n.mobOnly).map(n => n.id).join(",")').split(",");
  const reach = new Set([...doc.querySelectorAll("#stage [data-view]")]
    .map(b => b.dataset.view));
  const unreachable = hubIds.filter(id => id !== "home" && !reach.has(id));
  check("every section is reachable from the Overview",
    unreachable.length === 0, "missing: " + unreachable.join(", "));
  check("the Overview does not carry a profile card",
    !reach.has("profile"), [...reach].join(","));

  const mtabs = [...doc.querySelectorAll("#mtabs .mtab")].map(b => b.dataset.view);
  /* Four, not five. Profile was briefly a fifth tab; the dock that replaced
     the old bar carries four and a search circle, and the route to the
     profile is the account button, which shows the reader's own name. A
     fifth tab does still FIT — measured at 375px, 54.8px per tab against a
     41px longest label — so this is a design choice, not a constraint, and
     the check says four because four is what is intended. */
  check("the mobile bar carries exactly four tabs", mtabs.length === 4,
    mtabs.length + ": " + mtabs.join(","));
  check("the mobile bar is Overview, Map, Rounds, Revise",
    ["home","map","rounds","revise"].every(id => mtabs.includes(id)), mtabs.join(","));
  check("the dock does not carry a profile tab", !mtabs.includes("profile"), mtabs.join(","));
  /* With neither nav carrying it, the account button is the only way in —
     so it had better be there. */
  check("the account button is the way to the profile",
    !!doc.getElementById("acctbtn") && !doc.getElementById("acctbtn").hidden);
  const railIds = [...doc.querySelectorAll("#railnav .navbtn")].map(b => b.dataset.view);
  check("the rail does not repeat the phone bar's profile tab",
    !railIds.includes("profile"), railIds.join(","));

  ev('S.view="map"; render();');
  await wait(350);
  const lg = doc.querySelector(".maplegend");
  check("the legend has a toggle", !!doc.getElementById("lgtoggle"));
  if(lg){
    const body = lg.querySelector(".lgbody");
    const box = () => lg.getBoundingClientRect();
    check("the legend starts collapsed to an icon",
      lg.classList.contains("shut") && box().width < 60, box().width + "px wide");
    const shutW = box().width;
    doc.getElementById("lgtoggle").click();
    await wait(150);
    check("tapping the icon opens the panel",
      body.getBoundingClientRect().height > 0 && box().width > shutW);
    doc.getElementById("lgtoggle").click();
    await wait(150);
    check("tapping again collapses it back to the icon", lg.classList.contains("shut"));
    doc.getElementById("lgtoggle").click();
    await wait(150);
  }

  const fsel = doc.getElementById("focusd");
  check("a district focus picker exists", !!fsel);
  if(fsel){
    check("the picker lists every district",
      fsel.options.length === 13, fsel.options.length + " options");
    const shown = () => doc.querySelectorAll("#mapg .mk:not(.dim):not(.hid)").length;
    const all = shown();
    const zoom = () => Number(ev("ZT.k"));
    check("the map starts unzoomed", Math.abs(zoom() - 1) < 0.01, "k=" + zoom());

    /* open the panel first, so "it closes" is a real observation */
    if(doc.querySelector(".maplegend").classList.contains("shut")){
      doc.getElementById("lgtoggle").click();
      await wait(150);
    }
    fsel.value = "d-kinnaur";
    fsel.dispatchEvent(new win.Event("change"));
    await wait(600);
    const focused = shown();
    check("focusing a district dims markers outside it", focused < all,
      focused + " of " + all + " markers remain");
    check("focusing leaves that district's own markers lit", focused > 0);
    check("focusing moves the map to that district", zoom() > 1.2, "k=" + zoom());
    check("focusing does NOT open the record", doc.getElementById("panel").hidden);
    check("choosing a district closes the layers panel",
      doc.querySelector(".maplegend").classList.contains("shut"));
    const badge = doc.getElementById("focusbadge");
    check("a badge names the focused district", badge && !badge.hidden &&
      /Kinnaur/.test(badge.textContent), badge ? badge.textContent : "no badge");

    /* the badge is the discoverable way out; the empty-ground tap is tested below */
    badge.click();
    await wait(600);
    check("the badge clears the focus", ev("S.focus") === "");
    check("clearing focus restores every marker", shown() === all);
    check("clearing focus returns to the whole state",
      Math.abs(zoom() - 1) < 0.01, "k=" + zoom());

    /* tapping bare ground outside every district must also exit */
    fsel.value = "d-kinnaur";
    fsel.dispatchEvent(new win.Event("change"));
    await wait(600);
    const svgEl = doc.getElementById("hpsvg");
    const r2 = svgEl.getBoundingClientRect();
    pointerAt(svgEl, "pointerdown", r2.left + 4, r2.top + 4);
    pointerAt(svgEl, "pointerup",   r2.left + 4, r2.top + 4);
    await wait(600);
    check("tapping empty map ground exits focus", ev("S.focus") === "",
      "focus=" + ev("S.focus"));
  }

  const brand = doc.querySelector("#topbar .brandm");
  check("the wordmark is in the header", brand && /Parikrama Path/.test(brand.textContent),
    brand ? brand.textContent : "absent");
  const si = doc.getElementById("search");
  check("the search label reads Search \u2026",
    si && /^Search\s*\u2026$/.test(si.placeholder), si ? si.placeholder : "no input");

  /* the view's name moved out of the header onto its own strip */
  const vb = doc.getElementById("viewbar");
  check("a view bar exists below the header", !!vb);
  if(vb){
    ev('S.view="map"; render();'); await wait(250);
    check("the view bar names the current view",
      /Atlas/.test(doc.getElementById("vbtitle").textContent),
      doc.getElementById("vbtitle").textContent);
    ev('S.view="rounds"; render();'); await wait(250);
    check("the view bar follows the view",
      /Rounds/.test(doc.getElementById("vbtitle").textContent),
      doc.getElementById("vbtitle").textContent);
  }

  /* The button is always visible — it is the way into the profile, which
     shows the local streak, local notes and local progress, all of which
     exist and matter without an account. Only the sign-in affordance inside
     the profile stays gated on Firebase availability (checked below). */
  const ab = doc.getElementById("acctbtn");
  check("the account control exists", !!ab);
  check("the account button is visible regardless of Firebase availability",
    ab && ab.hidden === false,
    "hidden=" + (ab && ab.hidden) + " available=" + ev("authAvailable()"));
  check("renderAccount filled the account button's label",
    ab && ab.textContent.trim().length > 0, "label=" + JSON.stringify(ab && ab.textContent));
  check("the app works signed out", !doc.getElementById("stage").hidden);
  check("no Firebase SDK was loaded",
    !doc.querySelector('script[src*="firebase-app-compat"]'));

  win.openRec("d-kangra");
  await wait(200);
  const ta = doc.getElementById("notetext");
  check("a record panel offers a note field", !!ta);
  if(ta){
    ta.value = "Kangra fort fell to Jahangir in 1620";
    ta.dispatchEvent(new win.Event("input"));
    check("the counter tracks what is typed",
      /36 \/ 1000/.test(doc.getElementById("notecount").textContent),
      doc.getElementById("notecount").textContent);
    doc.getElementById("notesave").click();
    await wait(150);
    win.openRec("d-shimla"); await wait(150);
    win.openRec("d-kangra"); await wait(200);
    check("the note survives navigating away and back",
      doc.getElementById("notetext").value === "Kangra fort fell to Jahangir in 1620",
      JSON.stringify(doc.getElementById("notetext").value));
    check("the textarea enforces the cap",
      doc.getElementById("notetext").getAttribute("maxlength") === "1000");

    /* The path that actually lost notes: #pbody is replaced while the
       textarea still has focus, and the browser clears focus WITHOUT
       firing blur. Typing here and navigating away must still save. */
    const t2 = doc.getElementById("notetext");
    t2.focus();
    t2.value = "typed but never blurred";
    /* A real keystroke fires input, and that is what marks the editor
       dirty. Without it the editor is deliberately NOT saved — a stale
       textarea must never overwrite a note that synced in behind it — so
       setting .value alone would be testing the wrong contract. */
    t2.dispatchEvent(new win.Event("input"));
    win.openRec("d-shimla"); await wait(150);
    win.openRec("d-kangra"); await wait(200);
    check("a note typed and navigated away from is not lost",
      doc.getElementById("notetext").value === "typed but never blurred",
      JSON.stringify(doc.getElementById("notetext").value));

    /* Emptying a note leaves a tombstone {text:"", t} rather than removing
       the key. An absent key always loses to a present remote one in
       mergeNotes, so a plain removal was undone by the next sync. The
       tombstone carries the deletion's timestamp so it wins by recency,
       and realNotes hides it from every reader. */
    const t3 = doc.getElementById("notetext");
    t3.value = "   ";
    t3.dispatchEvent(new win.Event("input"));
    doc.getElementById("notesave").click();
    await wait(150);
    const stored = JSON.parse(win.localStorage.getItem("hpatlas:notes") || "{}");
    const tomb = stored["d-kangra"];
    check("an emptied note leaves a tombstone, not a blank note",
      !!tomb && tomb.text === "" && typeof tomb.t === "number",
      JSON.stringify(stored));
    check("the tombstone is hidden from every reader",
      !Object.prototype.hasOwnProperty.call(ev('realNotes(store.get("notes", {}))'), "d-kangra"));
    /* The editor still shows the whitespace that was typed — nothing
       re-renders the panel on save, and it should not. What matters is
       that reopening the record shows an empty editor, not the tombstone. */
    win.openRec("d-shimla"); await wait(150);
    win.openRec("d-kangra"); await wait(200);
    check("reopening an emptied note shows an empty editor",
      doc.getElementById("notetext").value === "",
      JSON.stringify(doc.getElementById("notetext").value));

    /* The block above deliberately ends with d-kangra's note removed, to
       cover the removal path. Write it back so the profile checks below
       have a real note to find. */
    win.openRec("d-kangra"); await wait(200);
    const t4 = doc.getElementById("notetext");
    t4.value = "Kangra fort fell to Jahangir in 1620";
    t4.dispatchEvent(new win.Event("input"));
    doc.getElementById("notesave").click();
    await wait(150);
  }

  doc.getElementById("acctbtn").click();
  await wait(250);
  check("the header button opens the profile",
    /Your profile/.test(doc.getElementById("vbtitle").textContent),
    doc.getElementById("vbtitle").textContent);
  const prof = doc.querySelector(".profile");
  check("the profile lists the note just written",
    !!prof && /Kangra/.test(prof.textContent));
  /* Gated BOTH ways: offered when a sign-in can actually work, absent when
     it cannot. Asserting only the absent branch could never pass here. */
  check("the sign-in affordance is gated on Firebase availability",
    !!doc.getElementById("psignin") === !!ev("authAvailable()"),
    "psignin=" + !!doc.getElementById("psignin") + " authAvailable=" + ev("authAvailable()"));
  /* Scoped to the notes index: data-go is also on every related-record chip,
     and an open record panel puts one of those earlier in the DOM. */
  /* The rings are the profile's headline: three arcs, each with a track and
     a progress stroke, ordered outermost-largest-goal. A ring that silently
     stopped drawing would look like a blank card, not like an error. */
  /* The sheet draws a drag handle on a phone, so it has to be draggable.
     Dispatched synchronously: a throttled background tab stretches even a
     5ms wait into a second, which would read as a slow drag. */
  win.openRec("d-kangra"); await wait(250);
  (function(){
    const panel = doc.getElementById("panel"), ph = doc.querySelector(".ph");
    const r = ph.getBoundingClientRect();
    const x = r.left + r.width/2, y0 = r.top + 10;
    const mk = (t, yy) => new win.PointerEvent(t, {bubbles:true, cancelable:true,
      pointerId:31, pointerType:"touch", clientX:x, clientY:yy, isPrimary:true});
    doc.getElementById("pbody").scrollTop = 0;
    panel.dispatchEvent(mk("pointerdown", y0));
    panel.dispatchEvent(mk("pointermove", y0 + 60));
    panel.dispatchEvent(mk("pointermove", y0 + 140));
    panel.dispatchEvent(mk("pointerup",   y0 + 200));
  })();
  await wait(400);
  check("the sheet closes when dragged down", doc.getElementById("panel").hidden);
  check("the drag leaves no transform stuck on the sheet",
    !doc.getElementById("panel").style.transform,
    doc.getElementById("panel").style.transform || "(cleared)");

  /* Compare: the superlative is the question type, so the table has to
     answer it without being scanned — and must not claim a superlative
     that is not one. */
  /* go() rather than setting S.view: closePanel above writes the hash on a
     timer, and the hashchange that follows re-renders whatever the hash
     says. Setting S.view alone loses that race and the table is wiped out
     from under the check. */
  await wait(500);
  win.go("compare");
  ev('S.cmpTab="districts"; S.cmpKey="area"; S.cmpDesc=true; render();');
  await wait(350);
  check("the compare table lists every district",
    doc.querySelectorAll("table.cmp tbody tr").length === 12,
    doc.querySelectorAll("table.cmp tbody tr").length + " rows");
  check("sorting by area puts the largest first",
    /Lahaul/.test(doc.querySelector("table.cmp tbody tr th").textContent),
    doc.querySelector("table.cmp tbody tr th").textContent);
  check("the largest is marked as the extreme",
    !!doc.querySelector("table.cmp tbody tr .xhi"));
  check("the table scrolls inside its own box, not the page",
    doc.querySelector(".cmpwrap") &&
    win.getComputedStyle(doc.querySelector(".cmpwrap")).overflowX === "auto");
  ev('S.cmpTab="states"; S.cmpKey="merged"; S.cmpDesc=true; render();');
  await wait(300);
  check("the hill states table lists them all",
    doc.querySelectorAll("table.cmp tbody tr").length === 23,
    doc.querySelectorAll("table.cmp tbody tr").length + " rows");
  /* Fifteen states merged in 1948. Marking all fifteen as "highest" would
     be noise dressed as a superlative, so a tied extreme is marked at all. */
  check("a tied extreme is not marked as a superlative",
    doc.querySelectorAll("table.cmp .xhi, table.cmp .xlo").length === 0,
    doc.querySelectorAll("table.cmp .xhi, table.cmp .xlo").length + " marks");
  check("founded is deliberately not sortable",
    !doc.querySelector('[data-cmpkey="founded"]'));
  /* The Economic Survey tab ships with no figures on purpose: they change
     every year and must come from the Survey itself. An empty table has to
     say so rather than look broken. */
  ev('S.cmpTab="economy"; render();');
  await wait(300);
  check("the Economic Survey tab lists the indicators the papers ask about",
    doc.querySelectorAll("table.econ tbody tr:not(.econgrp)").length === 21,
    doc.querySelectorAll("table.econ tbody tr:not(.econgrp)").length + " rows");
  check("an empty Economic Survey table says where the figures come from",
    !!doc.querySelector(".econwarn") &&
    /Economic Survey/.test(doc.querySelector(".econwarn").textContent));
  /* Every figure must be traceable: a number with no source is a number
     you cannot re-check when the next Survey moves it. */
  check("every filled row names where its figure came from",
    [...doc.querySelectorAll("table.econ tbody tr:not(.econgrp)")]
      .filter(tr => [...tr.querySelectorAll("td.n")].some(td => td.textContent.trim() !== "\u2014"))
      .every(tr => !!tr.querySelector(".econsrc")));
  check("the sources are linked", !!doc.querySelector(".econcite a"));
  check("the table says how many indicators are still blank",
    /still blank/.test(doc.querySelector(".cmpbar .cmphint").textContent),
    doc.querySelector(".cmpbar .cmphint").textContent.slice(0, 80));
  check("indicators do not pretend to be sortable",
    doc.querySelectorAll("table.econ .cmpsort").length === 0);
  /* Back to the profile: the ring checks below were reached by clicking the
     account button further up, and this block navigated away from it. */
  win.go("profile");
  await wait(350);

  check("the profile draws three streak rings",
    doc.querySelectorAll(".rings .rg-p").length === 3,
    "rg-p=" + doc.querySelectorAll(".rings .rg-p").length);
  check("each ring has a track behind it",
    doc.querySelectorAll(".rings .rg-t").length === 3);
  const radii = [...doc.querySelectorAll(".rings .rg-p")].map(c => +c.getAttribute("r"));
  check("rings run largest goal outermost to smallest innermost",
    radii.length === 3 && radii[0] > radii[1] && radii[1] > radii[2],
    JSON.stringify(radii));
  check("the ring legend names all three routes",
    /Facts/.test(doc.querySelector(".rg-legend").textContent) &&
    /Quiz/.test(doc.querySelector(".rg-legend").textContent) &&
    /Notes/.test(doc.querySelector(".rg-legend").textContent),
    doc.querySelector(".rg-legend") ? doc.querySelector(".rg-legend").textContent.trim() : "no legend");
  /* Seven cells, always — a gap in history draws an empty day rather than
     shortening the row, and today is the last cell. */
  check("the strip shows seven days", doc.querySelectorAll(".dstrip .dcell").length === 7,
    "cells=" + doc.querySelectorAll(".dstrip .dcell").length);
  check("each day in the strip draws three rings",
    [...doc.querySelectorAll(".dstrip .dcell")].every(c => c.querySelectorAll(".mr-p").length === 3));
  check("the last cell in the strip is today",
    [...doc.querySelectorAll(".dstrip .dcell")].pop().classList.contains("today"));
  check("the rings carry a spoken label for screen readers",
    /Today:/.test(doc.querySelector(".rings svg").getAttribute("aria-label") || ""),
    doc.querySelector(".rings svg") ? doc.querySelector(".rings svg").getAttribute("aria-label") : "no svg");

  const nrow = doc.querySelector(".noterow2[data-go]");
  check("the notes index links to its record", !!nrow);
  if(nrow){
    nrow.click();
    await wait(300);
    check("following a note opens its record",
      doc.getElementById("ptitle").textContent.indexOf("Kangra") >= 0,
      doc.getElementById("ptitle").textContent);
  }

  out.innerHTML += "\n" + pass + " passed, " + fail + " failed";
  document.title = fail ? "FAIL (" + fail + ")" : "PASS";
});
</script>
